<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Games</title>
    <!-- Hanabi's, It's a Wonderful World's, Small World's and Barrage's typefaces; Catan uses the system font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- The shell (menu, toasts), then each game's stylesheet from its folder. -->
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="css" href="src/games/catan/catan.css" />
    <link data-trunk rel="css" href="src/games/hanabi/hanabi.css" />
    <link data-trunk rel="css" href="src/games/wonderful/wonderful.css" />
    <link data-trunk rel="css" href="src/games/smallworld/smallworld.css" />
    <link data-trunk rel="css" href="src/games/barrage/barrage.css" />
    <!-- Small World's race portraits and power badges, from Days of Wonder's rule sheets. -->
    <link data-trunk rel="copy-dir" href="src/games/smallworld/art" data-target-path="smallworld-art" />
    <!-- It's a Wonderful World's card pictures and Empire boards, from the published cards (via Game Park). -->
    <link data-trunk rel="copy-dir" href="src/games/wonderful/art" data-target-path="wonderful-art" />
    <!-- Barrage's printed board and pieces, from a BoardGameGeek picture and the rulebook. -->
    <link data-trunk rel="copy-dir" href="src/games/barrage/art" data-target-path="barrage-art" />
    <link data-trunk rel="rust" data-bin="client" />
  </head>
  <body></body>
</html>
