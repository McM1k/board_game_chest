[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
catan-core = { workspace = true }
hanabi-core = { workspace = true }
wonderful-core = { workspace = true }
smallworld-core = { workspace = true }
protocol = { path = "../protocol" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
# Sending bug reports with fetch.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = { workspace = true }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "Storage", "Location", "Window", "Document",
  # Hanabi board: drag and drop, and measuring hands for the slide animation.
  "DragEvent", "DataTransfer", "Element", "HtmlElement", "HtmlDivElement", "DomRect", "CssStyleDeclaration",
  # It's a Wonderful World: the popovers over the other players' cards.
  "PointerEvent", "FocusEvent",
  # Bug reports: posting them, and saying where the player was.
  "Request", "RequestInit", "Response", "Headers", "Navigator",
]

[dev-dependencies]
rand = { workspace = true }
# Lets the native render tests turn views into HTML strings.
leptos = { version = "0.8", features = ["csr", "ssr"] }
# Effects spawn a task when they are created; the render tests need an
# executor to hand it to (they never run the tasks).
any_spawner = { version = "0.3", features = ["futures-executor"] }
